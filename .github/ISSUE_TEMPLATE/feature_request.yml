name: Feature request
description: Suggest a focused improvement to Atelier.
title: "[Idea]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the design task and what currently makes it difficult.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed behavior
      description: Explain a concrete improvement and an example of how you would use it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or references
      description: Optional. Link examples rather than uploading artwork or code you do not own.
